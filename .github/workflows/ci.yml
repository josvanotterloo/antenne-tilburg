name: CI

on:
  push:
  pull_request:
    branches: [master]
  schedule:
    # Catches a newly-published advisory on an unchanged dependency tree —
    # the main `ci` job only runs against a push/PR, so without this a
    # fresh high/critical finding could sit unnoticed between pushes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Isolated from `ci` on purpose: a new upstream advisory can fail this job
  # on a push that touches no dependency at all, and that must never block
  # Semgrep or the test suite. Keep this job listed as a required status
  # check in GitHub branch protection (Settings → Branches) alongside `ci`.
  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production-dependency vulnerabilities only — dev-only findings (e.g.
      # the eslint-toolchain brace-expansion cascade) are assessed and tracked
      # in tasks/todo.md instead of gating every push. One known finding
      # (deepmerge-ts via prisma -> @prisma/config) is allowlisted by name in
      # scripts/check-npm-audit.mjs — any other high/critical finding still
      # fails this step. See docs/features/security-dependency-updates.md.
      - name: npm audit (production dependencies)
        run: node scripts/check-npm-audit.mjs

  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: antenne_tilburg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d antenne_tilburg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      EMAIL_ENCRYPTION_KEY: ${{ secrets.EMAIL_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Binary downloaded directly from GitHub Releases and checksum-verified
      # — no marketplace action. Scans full git history; a real leak must
      # block everything else in this job, same as a real test failure.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --redact --no-banner

      # No engines field in package.json; @types/node pins the 20.x line.
      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # Native `semgrep scan`, not the deprecated semgrep/semgrep-action —
      # free/token-free for this ruleset, no Semgrep account needed. No
      # longer sequenced after npm audit — it must run regardless of that
      # job's outcome.
      - name: Semgrep security scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config p/typescript --config p/security-audit --severity ERROR --error

      # Fuzzy catalog search needs pg_trgm; create it before migrate deploy so
      # the extension exists regardless of migration ordering.
      - name: Enable pg_trgm
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Canonical full-suite entry point — same script the run-tests skill uses.
      - name: Run full test suite
        run: bash scripts/run-tests.sh
